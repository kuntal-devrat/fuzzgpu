name: Feature Request
description: Suggest an idea, optimization, or enhancement for fuzzgpu
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature or optimization! Please explain the use case and how it benefits fuzzgpu users.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem or limitation is.
      placeholder: "I am always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions, algorithms, or features you've considered.
  - type: dropdown
    id: area
    attributes:
      label: Area / Component
      description: Which part of the project does this affect?
      options:
        - Python API (fuzzgpu-python)
        - Core Rust Algorithms (fuzzgpu-core)
        - GPU Shaders / Kernels (WGSL)
        - WebAssembly (fuzzgpu-wasm)
        - Documentation & CI
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context, benchmarks, or references (e.g. papers, other libraries) here.
