# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[licenses]
# Only allow OSI-approved permissive / weak-copyleft licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]

[advisories]
# Deny any crate with a published security advisory.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
# pyo3 0.23.5 has multiple advisories that require upgrading to pyo3 >= 0.29 —
# a breaking API change that also requires numpy 0.29. Ignoring until the
# major-version bump lands.
ignore = [
    "RUSTSEC-2025-0020",
    "RUSTSEC-2025-0026",
    "RUSTSEC-2026-0177",
]

[bans]
# Warn on multiple versions of the same crate (common in large dependency trees).
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
