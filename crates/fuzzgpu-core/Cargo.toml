[package]
name = "fuzzgpu-core"
version = "0.1.7"
edition = "2021"
description = "GPU-accelerated fuzzy string matching engine"
license = "MIT"
repository = "https://github.com/kuntal-devrat/fuzzgpu"
homepage = "https://github.com/kuntal-devrat/fuzzgpu"
authors = ["Devrat Kuntal"]

[features]
default = ["gpu"]
gpu = ["wgpu", "pollster", "bytemuck"]

[dependencies]
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
thiserror = "2"
log = "0.4"
rayon = "1.10"

[dev-dependencies]
proptest = "1.11.0"
criterion = "0.5"
# Integration tests construct wgpu objects (e.g. pipeline layouts) to drive the
# public kernel-registration API; same version as the gpu feature's dep.
wgpu = { workspace = true }

[[bench]]
name = "bench"
harness = false
