[package]
name = "fuzzgpu-python"
version = "0.3.0"
edition = "2021"
description = "Python bindings for FuzzGPU: GPU-accelerated fuzzy string matching engine"
license = "MIT"
repository = "https://github.com/kuntal-devrat/fuzzgpu"
homepage = "https://github.com/kuntal-devrat/fuzzgpu"
authors = ["Devrat Kuntal"]

[lib]
name = "fuzzgpu"
crate-type = ["cdylib"]

[features]
default = ["gpu"]
gpu = ["fuzzgpu-core/gpu"]

[dependencies]
fuzzgpu-core = { path = "../fuzzgpu-core", version = "0.3.0", default-features = false }
pyo3 = { workspace = true, features = ["abi3-py310"] }
numpy = "0.23"
pollster = { workspace = true }
log = "0.4"
