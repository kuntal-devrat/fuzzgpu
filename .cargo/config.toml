# To test against the local patched wgpu (fix/queue-drop-drain-loop) before
# the fix ships in a crates.io release, uncomment and set the correct paths:
#
# [patch.crates-io]
# wgpu       = { path = "../../wgpu/wgpu" }
# wgpu-core  = { path = "../../wgpu/wgpu-core" }
# wgpu-hal   = { path = "../../wgpu/wgpu-hal" }
# wgpu-types = { path = "../../wgpu/wgpu-types" }
#
# Once the fix is merged and released, bump `wgpu = "X.Y"` in
# Cargo.toml and remove the patch section entirely.
